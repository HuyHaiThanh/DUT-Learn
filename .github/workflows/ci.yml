name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dutlearn
          POSTGRES_PASSWORD: dutlearn
          POSTGRES_DB: dutlearn_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U dutlearn -d dutlearn_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DUT_TEST_DATABASE_URL: postgresql+psycopg://dutlearn:dutlearn@127.0.0.1:5433/dutlearn_test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
